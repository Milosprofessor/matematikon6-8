name: Nezavisna provera prvog polugodista
on:
  push:
    branches:
      - feature/prvo-polugodiste-2026-27
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semester-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout development code
        uses: actions/checkout@v4
      - name: Setup locked Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install from existing lockfile
        run: npm run install:ci
      - name: Build application independently
        run: npm run build
      - name: Run all tests
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Typecheck QA
        run: node_modules/.bin/tsc --noEmit -p tsconfig.qa.json
